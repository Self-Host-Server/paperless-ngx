services:
  broker:
    image: docker.io/library/redis:7
    restart: unless-stopped
    volumes:
      - redisdata:/data

  db:
    image: docker.io/library/postgres:16
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: paperless

  gotenberg:
    image: docker.io/gotenberg/gotenberg:8.7
    restart: unless-stopped
    command:
      - "gotenberg"
      - "--chromium-disable-routes=true"

  tika:
    image: docker.io/apache/tika:3.3.1.0
    restart: unless-stopped

  webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    restart: unless-stopped
    depends_on:
      - db
      - broker
      - gotenberg
      - tika
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_DBENGINE: postgresql
      PAPERLESS_DBHOST: db
      PAPERLESS_DBNAME: paperless
      PAPERLESS_DBUSER: paperless
      PAPERLESS_DBPASS: paperless
      PAPERLESS_TIKA_ENABLED: 1
      PAPERLESS_TIKA_ENDPOINT: http://tika:9998
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://gotenberg:3000
      PAPERLESS_POST_CONSUME_SCRIPT: /usr/src/paperless/scripts/post_consume_receipt.py
      PAPERLESS_API_TOKEN: ${PAPERLESS_API_TOKEN}
      PAPERLESS_RECEIPT_TAG: ${PAPERLESS_RECEIPT_TAG:-Receipt}
      PAPERLESS_CLEAR_TAG: ${PAPERLESS_CLEAR_TAG:-Clear Statement}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://192.168.1.14:11434}
      OLLAMA_EXTRACTION_MODEL: ${OLLAMA_EXTRACTION_MODEL:-qwen2.5:7b}
      EMPLOYEE_NAME: ${EMPLOYEE_NAME}
      # Nested under the `media` volume rather than a fresh one: the
      # paperless entrypoint only chowns its own known paths (data, media,
      # consume, export) to the non-root paperless user, so a brand-new
      # top-level volume/bind-mount stays root-owned and unwritable.
      EXPENSE_OUTPUT_DIR: /usr/src/paperless/media/expense-statements
    volumes:
      - data:/usr/src/paperless/data
      - media:/usr/src/paperless/media
      - ./export:/usr/src/paperless/export:Z
      - ./consume:/usr/src/paperless/consume:Z
      - ./scripts/post_consume_receipt.py:/usr/src/paperless/scripts/post_consume_receipt.py:ro

volumes:
  data:
  media:
  pgdata:
  redisdata:
